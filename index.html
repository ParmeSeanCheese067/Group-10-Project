<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Book – Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0d2a4a;
            --mid-blue: #134074;
            --muted-blue: #4b80a4;
            --border: #c8d8e4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #b8d8d8;
            background-image: url('sky.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 40px;
        }

        .card {
            display: flex;
            width: 100%;
            max-width: 960px;
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(13,42,74,.18);
            min-height: 560px;
        }

        .left-panel {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: stretch;
        }

        .left-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .right-panel {
            flex: 1;
            padding: 72px 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #ffffff;
        }

        .right-panel h1 {
            font-size: 46px;
            font-weight: 900;
            color: #0d2a4a;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted-blue);
            letter-spacing: 1.6px;
            margin-bottom: 44px;
            text-align: center;
        }

        .form-group { margin-bottom: 28px; }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted-blue);
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 18px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            color: #0d2a4a;
            outline: none;
            transition: border-color .25s, box-shadow .25s;
            background: #fafcfe;
        }

        .form-group input::placeholder { color: #b0c4d4; }

        .form-group input:focus {
            border-color: var(--mid-blue);
            box-shadow: 0 0 0 3px rgba(19,64,116,.12);
            background: #fff;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0 36px;
        }

        .checkbox-row input[type=checkbox] {
            width: 16px;
            height: 16px;
            accent-color: var(--navy);
            cursor: pointer;
        }

        .checkbox-row span {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted-blue);
        }

        .submit-btn {
            display: block;
            width: 78%;
            margin: 0 auto;
            padding: 15px;
            background: var(--navy);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: background .25s, transform .1s, box-shadow .25s;
            box-shadow: 0 6px 20px rgba(13,42,74,.28);
        }

        .submit-btn:hover {
            background: #194d80;
            box-shadow: 0 8px 26px rgba(13,42,74,.36);
        }

        .submit-btn:active { transform: scale(.98); }

        footer {
            text-align: center;
            padding: 22px;
            font-size: 14px;
            font-weight: 700;
            color: #2a6080;
        }
    </style>
</head>
<body>

<main class="main-container">
    <div class="card">
        <div class="left-panel">
            <img src="coast.jpg">
        </div>

        <div class="right-panel">
            <h1>LOGIN</h1>
            <div class="subtitle">WELCOME BACK, USER</div>

            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" id="userInput" placeholder="Enter Username">
            </div>

            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" id="passInput" placeholder="Enter Password">
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="remember">
                <span>Keep me logged in</span>
            </div>

            <button class="submit-btn" onclick="validateLogin()">LOGIN</button>
        </div>
    </div>
</main>

<footer>4Q ICT9 PROJECT | Lee, Herrington, Manuntag |</footer>

<script>
    const CorrectUser = "GROUP10";
    const CorrectPass = "NOVEMBER10";
    let attempt = 0;
    const MaxTry = 3;

    function validateLogin() {
        const user = document.getElementById('userInput').value;
        const pass = document.getElementById('passInput').value;

        if (attempt >= MaxTry) {
            alert("Account Locked. Too many failed attempts.");
            return;
        }

        if (user === CorrectUser && pass === CorrectPass) {
            alert("Welcome!, " + CorrectUser);
            attempt = 0;
            sessionStorage.setItem('loggedIn', 'true');
            window.location.href = 'home.html';
        } else {
            attempt++;
            alert("Access Denied.\nAttempts left: " + (MaxTry - attempt));
            if (attempt === MaxTry) {
                alert("Account Locked.");
                document.getElementById('userInput').disabled = true;
                document.getElementById('passInput').disabled = true;
            }
        }
    }
</script>

</body>
</html>
